<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Set IP</title>
  <link rel="stylesheet" href="../fonts/font.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--background-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-color);
    }

    h2 {
      margin-bottom: 20px;
      color: var(--text-color);
      margin: 10px 0px 10px 0px;
    }

    form {
      background-color: white;
      padding: 25px;
      display: flex;
      flex-wrap: wrap;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 280px;
    }

    label {
      font-weight: 500;
      margin-right: 5px;
      color: #333333;
    }

    .ip-field {
      width: 40px;
      text-align: center;
      padding: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin: 0 0px;
    }

    input[type="number"]#port {
      width: 50px;
      padding: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #3498db;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    #result {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>

<body>
  <h2>Set Gripper IP and Port</h2>

  <form id="ipForm">
    <div style="display:flex; align-items:center">
      <label for="ip1" style="width: 40px;">IP:</label>
      <input type="number" id="ip1" class="ip-field" min="1" max="255" step="1" required
      onchange="if (Number(this.value) > Number(this.max)) this.value = this.max; if(Number(this.value) < Number(this.min)) this.value=this.min; this.value = Math.floor(this.value)"/>
      .
      <input type="number" id="ip2" class="ip-field" min="0" max="255" step="1" required
      onchange="if (Number(this.value) > Number(this.max)) this.value = this.max; if(Number(this.value) < Number(this.min)) this.value=this.min"/>
      .
      <input type="number" id="ip3" class="ip-field" min="0" max="255" step="1" required
      onchange="if (Number(this.value) > Number(this.max)) this.value = this.max; if(Number(this.value) < Number(this.min)) this.value=this.min"/>
      .
      <input type="number" id="ip4" class="ip-field" min="0" max="255" step="1" required 
      onchange="if (Number(this.value) > Number(this.max)) this.value = this.max; if(Number(this.value) < Number(this.min)) this.value=this.min"/>
    </div>
    <br />
    <div style="display: flex; align-items:center; width:100%; margin-top: 4px;">
      <label for="port" style="width:40px;">Port:</label>
      <input type="number" id="port" min="1" max="65535" step="1" required 
      onchange="if (Number(this.value) > Number(this.max)) this.value = this.max; if(Number(this.value) < Number(this.min)) this.value=this.min"/>
    </div>
    <button type="submit">Set IP</button>
  </form>

  <p id="result"></p>

  <script>
    document
      .getElementById("ipForm")
      .addEventListener("submit", function (e) {
        e.preventDefault();

        const ip = [
          parseInt(document.getElementById("ip1").value),
          parseInt(document.getElementById("ip2").value),
          parseInt(document.getElementById("ip3").value),
          parseInt(document.getElementById("ip4").value),
        ];

        const port = parseInt(document.getElementById("port").value);

        const result = SetIp(ip, port);
      });

    function SetIp(ipArray, port) {
      console.log("Setting IP to:", ipArray.join("."), "Port:", port);
      
      if (port < 1 || port > 65535) {
        console.error("Port number is out of range (1-65535)");
        document.getElementById("result").innerText = "❌ Error: Port number is out of range (1-65535)";
        return -1; 
      }

      if (port == 2607) {
        console.error("Port number 2607 is reserved for the gripper system");
        document.getElementById("result").innerText = "❌ Error: Port number 2607 is reserved for the gripper system";
        return -1; 
      }
      
      window.common.send("set-ip", { ipArray, port });

      document.getElementById("result").innerText = "✅ IP and Port set!";
      return 0; // 예시 성공
    }


    window.electronStore.get("gripperSystemSetting").then((settings)=>{
      const ipArray = settings.ip.split(".");
      const port = settings.port;

      document.getElementById("ip1").value = ipArray[0];
      document.getElementById("ip2").value = ipArray[1];
      document.getElementById("ip3").value = ipArray[2];
      document.getElementById("ip4").value = ipArray[3];

      document.getElementById("port").value = port;
    })

    function changeTheme(theme) {
      if (theme == 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else if (theme == 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }
    window.common.receive("apply-theme", (theme) => {
      changeTheme(theme);
    })
    window.electronStore.get("app").then(app => {
      changeTheme(app.theme);
    });
  </script>
</body>

</html>
