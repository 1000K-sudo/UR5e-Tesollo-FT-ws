<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="theme.css" />
  <title>Info</title>
  <style>
    @media(prefers-color-scheme: dark) {
      #theme-image {
        content: url("../images/logo_tesollo_2.png");
      }
    }
    img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      padding: 20px;
    }

    #homepage {
      cursor: pointer;
    }

    #homepage:hover {
      color: var(--primary-color);
    }

    #ok {
      position: absolute;
      font-size: 14px;
      font-weight: 600;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      padding: 10px 20px;
      border-style: outset;
      border-width: 1px;
      border-color: var(--border-color);
      border-radius: 4px;
      box-shadow: 1px 1px 4px 0px var(--shadow-color);
    }

    #ok:hover {
      color: white;
      background-color: var(--primary-color);
    }

    #ok:active {
      transform: translate(1px, calc(-50% + 1px));
    }
  </style>
</head>

<body>
  <div style="
        height: calc(100%);
        width: calc(100%);
        display: flex;
        flex-direction: column;
      ">
    <img id="theme-image" src="../images/logo_tesollo.png" />
    <div style="
          flex-grow: 1;
          background-color: var(--background-color);
          display: flex;
          flex-direction: column;
          gap: 10px;
          padding: 10px 30px;
          justify-content: center;
          color: var(--text-color);
        ">
      <h4>DGManager</h4>
      <label>© 2025 Tesollo Inc. All rights reserved. Unauthorized reproduction or
        distribution is prohibited.</label>
      <h4 id="homepage" style="text-decoration: underline">
        www.tesollo.com
      </h4>
    </div>
    <div style="height: 80px; position: relative">
      <button id="ok" onclick="window.close()">OK</button>
    </div>
  </div>

  <script>
    document
      .getElementById("homepage")
      .addEventListener("click", () => window.common.send("homepage"));
    //// 테마 설정 부분
    window.electronStore.get("app.theme").then((theme) => changeTheme(theme));
    function changeTheme(theme) {
      if (theme == "dark") {
        document.getElementById("theme-image").src = "../images/logo_tesollo_2.png";
        document.documentElement.setAttribute("data-theme", "dark");
      } else if (theme == "light") {
        document.getElementById("theme-image").src = "../images/logo_tesollo.png";
        document.documentElement.setAttribute("data-theme", "light");
      }
    }
    window.common.receive("apply-theme", (theme) => changeTheme(theme));
  </script>
</body>

</html>
