        <button id="grasp">GRASP</button>
        <button id="release">RELEASE</button>
      </div>
      <div style="height: 10px"></div>

      <div class="FINGER3 FINGER4 FINGER5 FINGER2" id="grasp-data-panel">
        <!-- <legend>Grasp Data</legend> -->
        <div style="flex-grow: 1">
          <label class="header">Grasping Algorithm</label>

          <select id="grasp-mode-3f" class="FINGER3">
            <option value="1">3 fingers toward center</option>
            <option value="2">2 fingers toward center(1 & 2)</option>
            <option value="3">2 fingers toward center(1 & 3)</option>
            <option value="4">2 fingers toward center(2 & 3)</option>
            <option value="5">parallel grasp</option>
            <option value="6">envelop grasp</option>
          </select>

          <select id="grasp-mode-5f" class="FINGER5">
            <option value="21">5 fingers toward center</option>
            <option value="22">3 fingers toward center</option>
            <option value="23">3 fingers parallel</option>
            <option value="24">2 fingers toward center(1 & 2)</option>
            <option value="25">2 fingers toward center(1 & 3)</option>
            <option value="26">2 fingers toward center(1 & 4)</option>
            <option value="27">2 fingers toward center(1 & 5)</option>
            <option value="28">5 fingers parallel</option>
            <option value="29">5 fingers envelop</option>
          </select>

          <select id="grasp-mode-4f" class="FINGER4">
            <option value="31">4 fingers toward center</option>
            <option value="32">4 fingers parallel</option>
            <option value="33">4 fingers envelop</option>
            <option value="34">4 fingers right parallel</option>
            <option value="35">4 fingers left parallel</option>
            <option value="36">2 fingers toward center(1 & 2)</option>
            <option value="37">2 fingers toward center(1 & 4)</option>
            <option value="38">2 fingers toward center(3 & 4)</option>
          </select>

          <select id="grasp-mode-2f" class="FINGER2">
            <option value="51">2 fingers toward center</option>
            <option value="52">2 fingers envelop</option>
          </select>
        </div>

        <div class="rename1" style="width: 64px">
          <label class="header">Force(N)</label>
          <!-- <div class="bubble-tooltip">
            <input class="range-input torque" type="range" step="0.1" min="0.0" max="20.0" value="3.0" />
          </div> -->
          <input id="grasp-torque" name="torque" class="torque" type="number" min="0.0" max="20.0" step="0.1"
            value="3.0" />
        </div>
        <div style="width: 100%; display:none" class="grasp-option">
          <label class="header">Grasp Option</label>
          <div style="display: flex; flex-direction: column; gap: 4px; transform: none;" class="FINGER3">
            <div style="display: flex; gap: 4px; margin-left: 6px">

                <input type="radio" name="option" value="0" checked />None</label>
              <label style="font-size: 14px">
                <input type="radio" name="option" value="1" />Parallel
                Mode</label>
              <label style="font-size: 14px">
                <input type="radio" name="option" value="2" />Fixed Tilt
                Mode</label>
            </div>
          </div>
          <label style="font-size: 14px; margin: 4px 6px">

            Grasping Mode</label>
