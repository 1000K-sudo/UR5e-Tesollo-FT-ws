<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>GPIO</title>
  <!-- <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet"> -->
 
  <link rel="stylesheet" href="theme.css"/>
  <link rel="stylesheet" href="gpio.css"/>
</head>

<body>
  <div class="container">
    <h1>GPIO Control Panel</h1>

    <!-- 아웃풋 스위치 섹션 -->
    <div class="section">
      <h2>OUTPUT</h2>
      <div class="switch">
        <input type="checkbox" id="output1">
        <label for="output1"> Output 1</label>
      </div>
      <div class="switch">
        <input type="checkbox" id="output2">
        <label for="output2"> Output 2</label>
      </div>
      <div class="switch">
        <input type="checkbox" id="output3">
        <label for="output3"> Output 3</label>
      </div>
    </div>

    <!-- 인풋 라디오 섹션 -->
    <div class="section">
      <h2>INPUT</h2>
      <div class="switch">
        <input type="radio" id="inputRadio" name="inputStatus">
        <label style="cursor: default;">Input 1</label>
      </div>
      <button class="btn" id="simulateInput" style="display: none;">Simulate</button>
    </div>

    <!-- 상태 메시지 영역 -->
    <div class="section">
      <div class="status" id="statusMessage"></div>
    </div>
  </div>

  <script type="module" src="../../src/renderer/Gpio.js"></script>
</body>

</html>
