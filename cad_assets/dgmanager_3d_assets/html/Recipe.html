<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none';" /> -->
  <title>Recipe</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="Recipe.css" />
</head>

<body>
  <div class="tab-container">
    <div class="tab-buttons">
      <button class="tab-link active FINGER3 FINGER4 FINGER5 FINGER1 FINGER2" id="PoseTab" onclick="openTab(event, 'Pose')">Pose</button>
      <button class="tab-link FINGER3 FINGER4 FINGER5 FINGER1 FINGER2" id="GainTab" onclick="openTab(event, 'Gain')">Gain</button>
      <button class="tab-link FINGER3 FINGER4 FINGER5 FINGER2" id="GraspTab" onclick="openTab(event, 'Grasp')">Grasp</button>
      <button class="tab-link FINGER3 FINGER4 FINGER5 FINGER1 FINGER2" id="BlendTab" onclick="openTab(event, 'Blend')">Blend</button>
    </div>
  </div>


  <div class="label-btn-container">
    <svg class="info" id="7.1" >
      <use href="../images/icons.svg#icon-info" style="margin-right: 25px;"></use>
    </svg>
    <label for="Recipe-motion-manager-btn">Open Recipe Manager</label>
    <button id="Recipe-motion-manager-btn" class="icon-button">
      <svg width="24" height="24">
        <use href="../images/icons.svg#icon-open"></use>
      </svg>
    </button>
  </div>

  <div style="justify-content: center; align-items:center; display:flex; margin-bottom:10px">
  <input type="text" id="search-input" placeholder="Enter search term" style="width:95%; padding:8px; border-width:thin">
  </div>
  
  <!-- 각 탭에 해당하는 콘텐츠 영역 -->
  <div id="Pose" class="tab-content active">
    <div class="center_div">
      <ul id="pose-recipe-list"></ul>
    </div>
  </div>

  <div id="Gain" class="tab-content">
    <div class="center_div">
      <ul id="gain-recipe-list"></ul>
    </div>
  </div>

  <div id="Grasp" class="tab-content">
    <div class="center_div">
      <ul id="grasp-recipe-list"></ul>
    </div>
  </div>

  <div id="Blend" class="tab-content">
    <div class="center_div">
      <ul id="blend-recipe-list"></ul>
    </div>
  </div>

  <!-- <div class="center">
    <div class="bottom_button_div">
      <button id="Recipe-motion-manager-btn" class="bottom_button">Recipe&Blend Setting</button>
      <button id="export-data-btn" class="bottom_button">Backup Data</button>
    </div>
  </div> -->
  <div class="label-btn-container">
    <label id="backup-recipe-label" for="export-data-btn">BACKUP RECIPE DATA </label>
    <button id="export-data-btn" class="icon-button">
      <svg width="24" height="24">
        <use href="../images/icons.svg#icon-save"></use>
      </svg>
    </button>
  </div>

  <!-- 기존 스크립트 파일 호출 -->
  <script src="../../src/renderer/Recipe.js"></script>
</body>

</html>
