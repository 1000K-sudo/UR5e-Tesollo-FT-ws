[server]
# Use socketcan for slcan0 interface
bustype = socketcan
channel = slcan0
[viz]
max_offset = 100
max_size = 100
arrows = full # use `half` or `full` to turn on
grid = on # use `off` to turn off
transparency = off # use `on` to turn on
origins = off # use `on` to turn on
fps = on # use `on` to show redraw rate of viz
ups = on # use `on` to show sensor update rate
temp_show = on # use `off` to disable temperature show (requires temperature enabled sensors to show up, otherwise hidden)

[sensor]
num_of_sensor = 1
model = DG-5F-R
